[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-context-poisoning-lab"
version = "0.1.0"
description = "A reproducible lab that measures how LLM agents treat untrusted MCP (web browser) content: indirect prompt injection, context poisoning, source-authority and DNS manipulation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "ConnorDev", email = "connordev@protonmail.com" }]
keywords = ["mcp", "prompt-injection", "llm-security", "ai-safety", "context-poisoning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
# The scoring/stats/report core and the mock agents are stdlib-only. Everything
# that talks to the network or a model lives behind an extra.
services = ["fastapi>=0.110", "uvicorn>=0.29", "mcp>=1.2"]
agent = ["httpx>=0.27", "mcp>=1.2"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "pyyaml>=6"]
plot = ["matplotlib>=3.8"]

[project.scripts]
mcplab = "mcplab.cli:main"

[project.urls]
Homepage = "https://github.com/ConnorDev1337/mcp-context-poisoning-lab"
Issues = "https://github.com/ConnorDev1337/mcp-context-poisoning-lab/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
