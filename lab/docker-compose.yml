# Three ways to run the lab:
#
#   docker compose up --build                 # deterministic mock demo -> ./runs
#   docker compose --profile ollama up --build# compare a local Ollama model
#   docker compose --profile wire up --build   # over-the-wire MCP + web + collector
#
# The default and the ollama profile use the in-process browser (the network is
# modelled faithfully in code). The wire profile runs the MCP Browser and the
# web/collector services as separate containers on an isolated internal network.

name: mcplab

services:
  # --- default: deterministic mock demo, no model, no network ---------------
  harness:
    build:
      context: ..
      dockerfile: Dockerfile
    volumes:
      - ../runs:/runs
    networks: [egress]

  # --- profile ollama: real local model via Ollama --------------------------
  # Use a tool-capable model: this harness drives the agent through tool calls,
  # so a model without tool support (e.g. phi3:mini) is rejected by Ollama.
  ollama:
    image: ollama/ollama:0.12.3
    profiles: ["ollama"]
    volumes:
      - ollama:/root/.ollama
    networks: [egress]
    # For NVIDIA GPU acceleration, uncomment (needs the NVIDIA Container Toolkit).
    # Leave commented on CPU-only hosts, or `docker compose up` will fail.
    # gpus: all

  # One-shot: wait for the server, then pull the model before the run starts.
  ollama-pull:
    image: ollama/ollama:0.12.3
    profiles: ["ollama"]
    depends_on: [ollama]
    environment:
      MCPLAB_MODEL: "qwen2.5:7b-instruct"
      OLLAMA_HOST: "http://ollama:11434"
    entrypoint: ["sh", "-c"]
    command:
      - 'until ollama list >/dev/null 2>&1; do echo "waiting for ollama..."; sleep 1; done;
        ollama pull "$$MCPLAB_MODEL"'
    networks: [egress]

  harness-ollama:
    build:
      context: ..
      dockerfile: Dockerfile
    profiles: ["ollama"]
    depends_on:
      ollama:
        condition: service_started
      ollama-pull:
        condition: service_completed_successfully
    environment:
      MCPLAB_MODEL: "qwen2.5:7b-instruct"
    command: >
      sh -c "mcplab run --backend ollama --model $$MCPLAB_MODEL
      --base-url http://ollama:11434/v1 --reps 5 --out /runs/raw.jsonl &&
      mcplab report --in /runs/raw.jsonl --out-dir /runs"
    volumes:
      - ../runs:/runs
    networks: [egress]

  # --- profile wire: real MCP server + web + collector, isolated ------------
  web:
    build: { context: .., dockerfile: Dockerfile }
    profiles: ["wire"]
    command: ["python", "-c", "from mcplab.services import serve_app; serve_app('web', port=80)"]
    networks:
      lab:
        # Every lab hostname resolves to this one web container (isolated DNS).
        aliases:
          - nimbusdb.test
          - get-nimbusdb.test
          - nimbusdb-advisory.test
          - nimbus-forum.test
          - nimbus-blog.test
          - nimbus-wiki.test
          - nimbus-news.test
          - news.test
          - evil-cdn.test

  collector:
    build: { context: .., dockerfile: Dockerfile }
    profiles: ["wire"]
    command:
      ["python", "-c", "from mcplab.services import serve_app; serve_app('collector', port=80)"]
    networks:
      lab:
        aliases: [collector.test]

  mcp-browser:
    build: { context: .., dockerfile: Dockerfile }
    profiles: ["wire"]
    command: ["mcplab", "serve-browser", "--port", "8000"]
    environment:
      MCPLAB_WEB_BASE: "http://web.lab"
    depends_on: [web, collector]
    networks: [lab]
    ports:
      - "127.0.0.1:8000:8000"  # exposed on loopback for an MCP client to connect

networks:
  egress:
    driver: bridge
  lab:
    driver: bridge
    internal: true  # no route to the internet; nothing outside can reach it

volumes:
  ollama:
