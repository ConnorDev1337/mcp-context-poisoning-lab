[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-web-browser"
version = "1.2.0"
description = "A fast, lightweight MCP web browsing tool for AI assistants. Search the web and read pages directly from your AI agent."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "WebToolsAI", email = "contact@webtoolsai.dev" }]
keywords = ["mcp", "web-browser", "ai-tools", "claude", "agent"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Pinned to mcp 1.x: FastMCP lives at mcp.server.fastmcp here. In mcp 2.x it was
# renamed to MCPServer and the API changed, which breaks this server on import.
dependencies = [
    "mcp>=1.2,<2",
    "httpx>=0.27",
    "uvicorn>=0.29",
    "fastapi>=0.110",
]

[project.scripts]
mcp-web-browser = "mcp_web_browser.server:main"

[tool.setuptools.packages.find]
where = ["src"]
