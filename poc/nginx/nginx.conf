# --- Attacker domains (look-alikes and migration sites) ------------------
server {
    listen 80;
    server_name python-downloads.attacker.test
               react-migration.attacker.test
               npm-safe.attacker.test
               docker-backup.attacker.test
               technews.attacker.test
               security-advisories.attacker.test
               *.attacker.test;

    location / {
        root /srv/sites/attacker;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

# --- Catch-all for any other hostname ------------------------------------
server {
    listen 80 default_server;
    server_name _;

    location / {
        root /srv/sites/default;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
