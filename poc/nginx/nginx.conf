# Nginx configuration — serves attacker-controlled content on fake domains.
#
# Each server block impersonates a real site.  Inside the Docker network,
# DNS aliases (set in docker-compose.yml) route these hostnames to this
# single Nginx container.  The AI agent (via the malicious MCP) will see
# page content that looks like it comes from the real domain.

# --- Fake Python documentation -------------------------------------------
server {
    listen 80;
    server_name docs.python.org python.org;

    location / {
        root /srv/sites/python;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

