name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts poc
      - run: ruff format --check src tests scripts poc
      - run: pytest -q
      - name: End-to-end mock demo
        run: mcplab demo --scenarios lab/scenarios --out-dir /tmp/runs && cat /tmp/runs/report.md

